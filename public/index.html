<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Repair Helper</title>
  <script>
    // Legible boot: apply the saved theme before first paint (no flash)
    try {
      // App defaults (once): dark background, 18px Inter. Change any time with the Aa button.
      if (!localStorage.getItem("crh.defaults.v1")) {
        var d = JSON.parse(localStorage.getItem("legible.prefs.v1") || "{}");
        d.version = 1; d.theme = "dark"; d.font = "inter"; d.sizePx = 18; d.preset = "custom";
        localStorage.setItem("legible.prefs.v1", JSON.stringify(d));
        localStorage.setItem("crh.defaults.v1", "1");
      }
      var p = JSON.parse(localStorage.getItem("legible.prefs.v1") || "{}");
      var dark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", p.theme && p.theme !== "system" ? p.theme : dark ? "dark" : "light");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/legible/tokens.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🔧 Car Repair Helper</h1>
    <div class="row">
      <button id="collapseAll" class="ghost" title="Collapse every section">⇕<span class="lbl"> Collapse all</span></button>
      <button id="newBtn" class="ghost" title="New repair">+<span class="lbl"> New repair</span></button>
    </div>
  </header>

  <main>
    <!-- Step 1: pick a car, then Replace a part or Diagnose -->
    <details id="intake" class="card sec" open>
      <summary><h2 class="grow">My cars</h2><span class="meta" id="intakeMeta"></span></summary>
      <div class="sec-body">
        <div id="carChips" class="row"></div>
        <div id="carForm" class="hidden">
          <div class="grid">
            <label class="field">Year<input id="year" placeholder="2012" inputmode="numeric" /></label>
            <label class="field">Make<input id="make" placeholder="Honda" /></label>
            <label class="field">Model<input id="model" placeholder="Civic" /></label>
            <label class="field">Engine / trim<input id="engine" placeholder="1.8L EX (optional)" /></label>
            <label class="field">Mileage<input id="mileage" placeholder="optional" inputmode="numeric" /></label>
            <label class="field">Nickname<input id="nick" placeholder="optional, e.g. Mom's car" /></label>
          </div>
          <div class="row" style="margin-top:var(--space-2)"><button class="primary" id="carSave">Save car</button><button id="carCancel">Cancel</button><button class="quiet" id="carDelete">Delete car</button></div>
        </div>
        <div id="modeBox" class="hidden">
          <div class="seg" role="tablist">
            <button role="tab" data-tab-mode="replace">🔧 Replace a part</button>
            <button role="tab" data-tab-mode="diagnose">🩺 Diagnose a problem</button>
          </div>
          <div id="replacePane">
            <label class="field">Which part?
              <input id="part" placeholder="e.g. alternator, front brake pads, serpentine belt" />
            </label>
            <div style="margin-top:var(--space-2)"><button id="replaceBtn" class="primary">Find videos</button></div>
          </div>
          <div id="diagPane" class="hidden">
            <label class="field">What's it doing?
              <textarea id="symptoms" rows="3" placeholder="e.g. Battery light flickers, slow to start in the morning, headlights dim at idle. Started last week."></textarea>
            </label>
            <div style="margin-top:var(--space-2)"><button id="diagnoseBtn" class="primary">Find likely problems</button></div>
          </div>
        </div>
      </div>
    </details>

    <!-- Current repair: notes, save to library, mark fixed -->
    <section id="project" class="hidden"></section>

    <!-- Step 2: diagnosis -->
    <section id="diagnosis" class="hidden"></section>

    <!-- Step 3: videos (one list per problem you searched) -->
    <section id="videos" class="hidden"></section>

    <!-- Step 4: breakdown of one video -->
    <section id="breakdown" class="hidden"></section>

    <!-- 📚 Jobs for the selected car -->
    <section id="library" class="hidden"></section>

    <!-- Saved ⭐ photos -->
    <section id="saved" class="hidden"></section>
  </main>

  <div id="lightbox" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <!-- Legible reader: the "Aa" button – theme, text size, spacing, contrast -->
  <legible-reader target="body" presets="all" load-fonts></legible-reader>
  <script type="module" src="/legible/legible-reader.js"></script>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/app.js"></script>
</body>
</html>
