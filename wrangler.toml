name = "car-repair-helper"
main = "src/index.js"
compatibility_date = "2025-10-01"
# Keep variables added in the Cloudflare dashboard when redeploying from GitHub
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# Cloud sync storage (free Workers KV). Cloudflare creates it automatically on deploy.
[[kv_namespaces]]
binding = "STORE"

[vars]
# Main reasoning model (any OpenRouter model id)
MODEL = "deepseek/deepseek-v4.1-flash"
# Used automatically if MODEL errors or returns broken output
FALLBACK_MODEL = "anthropic/claude-haiku-5.5"
# Model that can watch YouTube videos directly (Gemini)
VIDEO_MODEL = "google/gemini-3.8-flash"
# Model that checks each step photo really shows the part (any model that reads images)
PHOTO_MODEL = "anthropic/claude-haiku-5.5"

# Secrets (set in Cloudflare dashboard or `npx wrangler secret put NAME`):
#   OPENROUTER_API_KEY  - required
#   APP_PASSWORD        - recommended, locks the site so nobody else burns your credits
#   YOUTUBE_API_KEY     - optional fallback if YouTube scraping gets blocked
